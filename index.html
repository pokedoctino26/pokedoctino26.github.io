<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PokéDoc Tino</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#FCE5BC;color:#1A140E;font-family:'Segoe UI',Arial,sans-serif}
header{text-align:center;padding:55px 20px 40px;background:linear-gradient(180deg,#FCE5BC,#f5d9a0);border-bottom:6px solid #2596BE}
.logo{width:180px;height:180px;border-radius:50%;border:6px solid #2596BE;object-fit:cover;background:#000;margin:auto;display:block}
h1{color:#2596BE;letter-spacing:3px;margin:18px 0 6px}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.btn{background:#2596BE;color:#fff;padding:12px 24px;border-radius:50px;text-decoration:none;font-weight:900}
section{max-width:950px;margin:auto;padding:30px 16px;text-align:center}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.gal-item{border:3px solid #2596BE;border-radius:16px;overflow:hidden;aspect-ratio:1/1;background:#fff;cursor:pointer;position:relative}
.gal-item img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:6px;left:6px;background:#2596BE;color:#fff;padding:3px 8px;border-radius:12px;font-size:.7em;font-weight:900}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:9999}
#lightbox.show{display:flex}
#lightbox img{max-width:90vw;max-height:85vh;border-radius:12px;border:4px solid #fff}
#lightbox span{position:absolute;top:15px;right:20px;color:#fff;font-size:40px;cursor:pointer}
.card{background:#fff;border:3px solid #2596BE;border-radius:18px;padding:18px;margin:12px auto;max-width:700px;text-align:left}
</style>
</head>
<body>
<header>
<img id="logo" src="logo2.png" class="logo">
<h1>POKÉDOC TINO</h1>
<p>Restauro e conservazione carte Pokémon — Grosseto</p>
<div class="btns">
<a class="btn" href="https://www.instagram.com/pokedoctino26/" target="_blank">Instagram</a>
<a class="btn" href="https://www.tiktok.com/@pokedoctino26" target="_blank">TikTok</a>
<a class="btn" href="https://tally.so/r/LZRYbp" target="_blank">✨ Prenota Ora</a>
</div>
</header>
<section>
<h2 style="color:#2596BE">I MIEI LAVORI</h2>
<div class="gallery" id="gallery"></div>

<h2 style="color:#2596BE;margin-top:40px">PREZZARIO</h2>
<div class="card"><b>Fino a 200€</b> - Pulizia 15€ / Restauro 25€</div>
<div class="card"><b>200-400€</b> - Pulizia 20€ / Restauro 35€</div>
<div class="card"><b>Oltre 400€</b> - Pulizia 20€ / Restauro 40€</div>
<p style="margin-top:30px;opacity:.6">© 2026 PokéDoc Tino</p>
</section>
<div id="lightbox"><span id="close">×</span><img id="big"></div>
<script>
document.getElementById('logo').src='logo2.png?v='+Date.now();
// CAMBIA QUESTO NUMERO se ne hai caricate più o meno di 21
const NUM_FOTO = 21; 
const g=document.getElementById('gallery');
for(let i=1;i<=NUM_FOTO;i++){
  const f=`gallery/${i}.png`;
  const d=document.createElement('div');d.className='gal-item';
  d.innerHTML=`<img src="${f}?v=${Date.now()}" loading="lazy" onerror="this.parentElement.style.display='none'"><div class="badge">LAVORO #${i}</div>`;
  d.onclick=()=>{document.getElementById('big').src=f;document.getElementById('lightbox').classList.add('show')};
  g.appendChild(d);
}
document.getElementById('close').onclick=()=>document.getElementById('lightbox').classList.remove('show');
document.getElementById('lightbox').onclick=e=>{if(e.target.id==='lightbox')e.currentTarget.classList.remove('show')};
</script>
</body>
</html>
