<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PokéDoc Tino - Gallery Restore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#FCE5BC;font-family:Arial, sans-serif}
header{text-align:center;padding:30px 15px;border-bottom:6px solid #2596BE}
.logo{width:140px;height:140px;border-radius:50%;border:5px solid #2596BE;object-fit:cover;background:#fff}
h1{color:#2596BE;margin:15px 0}
.btn{background:#2596BE;color:#fff;padding:10px 20px;border-radius:30px;text-decoration:none;font-weight:900;margin:5px;display:inline-block}
.cover-wrap{max-width:700px;margin:30px auto;text-align:center;padding:0 15px}
#cover{width:100%;border-radius:20px;border:5px solid #2596BE;cursor:pointer}
.section{max-width:950px;margin:auto;padding:15px}
.group{background:#fff;border:3px solid #2596BE;border-radius:16px;padding:15px;margin-bottom:25px}
.group h2{margin:0 0 12px;color:#2596BE;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:2px solid #eee;cursor:pointer;transition:.2s}
.grid img:hover{transform:scale(1.03)}
#light{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:99}
#light.show{display:flex}#light img{max-width:95%;max-height:85%;border-radius:12px}
</style>
</head>
<body>
<header>
<img src="logo2.png" class="logo" onerror="this.src='logo.jpg'">
<h1>POKÉDOC TINO</h1>
<a class="btn" href="https://www.instagram.com/pokedoctino26/" target="_blank">Instagram</a>
<a class="btn" href="https://www.tiktok.com/@pokedoctino26" target="_blank">TikTok</a>
</header>

<div class="cover-wrap">
<p style="color:#2596BE;font-weight:900">⬇️ CLICCA QUI SOTTO PER VEDERE I LAVORI ⬇️</p>
<img id="cover" src="gallery.jpg" alt="Galleria Lavori">
</div>

<div class="section" id="lavori">
<div class="group"><h2>Arcanine leg. collection (1 e 2)</h2><div class="grid"><img src="galleryrestore/1.jpg"><img src="galleryrestore/2.jpg"></div></div>
<div class="group"><h2>Garchomp ex (3 e 4)</h2><div class="grid"><img src="galleryrestore/3.jpg"><img src="galleryrestore/4.jpg"></div></div>
<div class="group"><h2>Gengar Fossil (5,6,7,8)</h2><div class="grid"><img src="galleryrestore/5.jpg"><img src="galleryrestore/6.jpg"><img src="galleryrestore/7.jpg"><img src="galleryrestore/8.jpg"></div></div>
<div class="group"><h2>Vaporeon jungle (9,10,11,12)</h2><div class="grid"><img src="galleryrestore/9.jpg"><img src="galleryrestore/10.jpg"><img src="galleryrestore/11.jpg"><img src="galleryrestore/12.jpg"></div></div>
<div class="group"><h2>Venusaur Base set (13,14)</h2><div class="grid"><img src="galleryrestore/13.jpg"><img src="galleryrestore/14.jpg"></div></div>
<div class="group"><h2>Lugia Crystal (15,16)</h2><div class="grid"><img src="galleryrestore/15.jpg"><img src="galleryrestore/16.jpg"></div></div>
<div class="group"><h2>Nidoking leg. collection (17,18)</h2><div class="grid"><img src="galleryrestore/17.jpg"><img src="galleryrestore/18.jpg"></div></div>
<div class="group"><h2>Naruto promo DB (19,20)</h2><div class="grid"><img src="galleryrestore/19.jpg"><img src="galleryrestore/20.jpg"></div></div>
</div>

<div id="light"><img id="lightImg"></div>

<script>
document.getElementById('cover').onclick=()=>document.getElementById('lavori').scrollIntoView({behavior:'smooth'});
const light=document.getElementById('light'), lightImg=document.getElementById('lightImg');
document.querySelectorAll('.grid img').forEach(im=>{
 im.onclick=()=>{lightImg.src=im.src; light.classList.add('show')}
});
light.onclick=()=>light.classList.remove('show');
</script>
</body>
</html>
