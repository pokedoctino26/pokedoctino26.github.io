<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PokéDoc Tino</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#FCE5BC;font-family:Arial,sans-serif}
header{text-align:center;padding:30px 15px;background:#FCE5BC;border-bottom:6px solid #2596BE}
.logo{width:140px;height:140px;border-radius:50%;border:5px solid #2596BE;object-fit:cover;background:#fff}
h1{color:#2596BE;margin:15px 0 10px;font-weight:900}
.btn{background:#2596BE;color:#fff;padding:10px 20px;border-radius:30px;text-decoration:none;font-weight:900;margin:5px;display:inline-block}
.cover-wrap{max-width:700px;margin:30px auto;text-align:center;padding:0 15px}
.cover-wrap p{color:#2596BE;font-weight:800}
#cover{width:100%;max-width:600px;border-radius:20px;border:5px solid #2596BE;cursor:pointer;transition:.2s}
#cover:hover{transform:scale(1.02)}
.section{max-width:950px;margin:0 auto;padding:20px 15px}
.group{background:#fff;border:3px solid #2596BE;border-radius:16px;padding:15px;margin-bottom:25px}
.group h2{margin:0 0 12px;color:#2596BE;font-size:19px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:2px solid #eee;cursor:pointer}
#light{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:99;padding:20px}
#light.show{display:flex}
#light img{max-width:95%;max-height:85%;border-radius:12px}
</style>
</head>
<body>

<header>
<img src="logo2.png" class="logo" onerror="this.src='logo.jpg'">
<h1>POKÉDOC TINO</h1>
<a class="btn" href="https://www.instagram.com/pokedoctino26/" target="_blank">Instagram</a>
<a class="btn" href="https://www.tiktok.com/@pokedoctino26" target="_blank">TikTok</a>
<a class="btn" href="https://tally.so/r/LZRYbp" target="_blank">Prenota Valutazione</a>
</header>

<div class="cover-wrap">
<p>⬇️ CLICCA PER VEDERE I LAVORI ⬇️</p>
<img id="cover" src="galleryrestore/gallery.jpg" onerror="this.src='gallery.jpg';this.onerror=null" alt="Galleria">
</div>

<div class="section" id="lavori">

<div class="group"><h2>Arcanine leg. collection</h2><div class="grid">
<img loading="lazy" src="galleryrestore/1.jpg"><img loading="lazy" src="galleryrestore/2.jpg"></div></div>

<div class="group"><h2>Garchomp ex</h2><div class="grid">
<img loading="lazy" src="galleryrestore/3.jpg"><img loading="lazy" src="galleryrestore/4.jpg"></div></div>

<div class="group"><h2>Gengar Fossil</h2><div class="grid">
<img loading="lazy" src="galleryrestore/5.jpg"><img loading="lazy" src="galleryrestore/6.jpg"><img loading="lazy" src="galleryrestore/7.jpg"><img loading="lazy" src="galleryrestore/8.jpg"></div></div>

<div class="group"><h2>Vaporeon jungle</h2><div class="grid">
<img loading="lazy" src="galleryrestore/9.jpg"><img loading="lazy" src="galleryrestore/10.jpg"><img loading="lazy" src="galleryrestore/11.jpg"><img loading="lazy" src="galleryrestore/12.jpg"></div></div>

<div class="group"><h2>Venusaur Base set</h2><div class="grid">
<img loading="lazy" src="galleryrestore/13.jpg"><img loading="lazy" src="galleryrestore/14.jpg"></div></div>

<div class="group"><h2>Lugia Crystal</h2><div class="grid">
<img loading="lazy" src="galleryrestore/15.jpg"><img loading="lazy" src="galleryrestore/16.jpg"></div></div>

<div class="group"><h2>Nidoking leg. collection</h2><div class="grid">
<img loading="lazy" src="galleryrestore/17.jpg"><img loading="lazy" src="galleryrestore/18.jpg"></div></div>

<div class="group"><h2>Naruto promo DB</h2><div class="grid">
<img loading="lazy" src="galleryrestore/19.jpg"><img loading="lazy" src="galleryrestore/20.jpg"></div></div>

</div>

<div id="light"><img id="lightImg"></div>

<script>
document.getElementById('cover').onclick=()=>document.getElementById('lavori').scrollIntoView({behavior:'smooth'});
const light=document.getElementById('light'), lightImg=document.getElementById('lightImg');
document.querySelectorAll('.grid img').forEach(img=>{
 img.onclick=()=>{lightImg.src=img.src; light.classList.add('show')}
});
light.onclick=()=>light.classList.remove('show');
</script>
</body>
</html>
